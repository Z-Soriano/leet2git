<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>leet2git</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
</head>
<body>
  <main>
    <header class="header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">&lt;/&gt;</span>
        <div>
          <h1 class="brand-name">leet<span>2</span>git</h1>
          <div class="brand-caption">LEETCODE TO GITHUB</div>
        </div>
      </div>
      <span id="sync-state" class="state" data-state="setup">SETUP</span>
    </header>

    <p class="intro">New Accepted submissions go straight to your GitHub repository.</p>

    <form id="settings">
      <label class="sync-row" for="enabled">
        <span>
          <strong>Auto sync</strong>
          <small>Save new Accepted submissions</small>
        </span>
        <input id="enabled" type="checkbox" checked>
        <span class="switch" aria-hidden="true"></span>
      </label>

      <section class="settings-section" aria-labelledby="destination-heading">
        <h2 id="destination-heading">Destination</h2>

        <label class="field-label" for="repo">Repository</label>
        <input id="repo" name="repo" value="leetcode-solutions" required pattern="[A-Za-z0-9_.-]+" autocomplete="off" spellcheck="false">

        <label class="field-label" for="token">GitHub token</label>
        <input id="token" name="token" type="password" autocomplete="off" placeholder="Paste a token to connect">
        <p id="token-hint" class="field-hint"></p>

        <label class="public-row" for="public">
          <input id="public" type="checkbox">
          <span>Make a new repository public</span>
        </label>

        <button id="save" type="submit">Save &amp; connect <span aria-hidden="true">↗</span></button>
        <p id="message" role="status" aria-live="polite"></p>
      </section>
    </form>

    <section class="activity" aria-labelledby="activity-heading">
      <div class="activity-header">
        <h2 id="activity-heading">Recent activity</h2>
        <time id="last-status-time"></time>
      </div>
      <p id="last-status">No activity yet.</p>
    </section>

    <p class="privacy-note">Your token stays in this browser profile. LeetCode uses your current login.</p>
  </main>
</body>
</html>
